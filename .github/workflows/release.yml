name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发版的 tag（例如 v2.1.0），必须已经推送到仓库"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: 从 CHANGELOG 抽出当前版本的说明
        id: notes
        env:
          REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ["REF_NAME"]              # v1.0.0
          text = open("CHANGELOG.md", encoding="utf-8").read()
          pat = re.compile(r"^## \[" + re.escape(tag) + r"\].*?(?=^## \[|\Z)", re.M | re.S)
          m = pat.search(text)
          body = m.group(0).strip() if m else ("## " + tag)
          with open("notes.md", "w", encoding="utf-8") as f:
              f.write(body)
          print(body[:400])
          PY

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.tag || github.ref_name }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: notes.md
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
